name: Dependency and publication checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guardian-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Vulnerabilities, secrets and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vuln check-docs
      - name: Scan publication for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --no-banner --redact --exit-code 1 .
