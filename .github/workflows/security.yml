name: Dependency and publication checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guardian-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Vulnerabilities, secrets and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: make vuln check-docs
      - name: Scan publication for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --no-banner --redact --exit-code 1 .
