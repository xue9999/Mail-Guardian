# Uczenie następuje wyłącznie po ręcznym przeniesieniu wiadomości do folderu
# AI-Naucz-spam lub AI-Naucz-wazne. Automatyczne uczenie jest celowo wyłączone.
backend = "redis";
new_schema = true;
# Walidacja na oddzielonych przykładach sprawdza użyteczność modelu od 100
# statystycznych przykładów obu klas. Aktywacja wymaga zapisanego raportu;
# trwałe usuwanie zachowuje odrębne minimum 200/200 i swoje pozostałe blokady.
min_learns = 100;
autolearn = false;

# Mniej znaczące tokeny wygasają po około 100 dniach; ważne tokeny są
# zachowywane przez moduł bayes_expiry.
expire = 8640000;
